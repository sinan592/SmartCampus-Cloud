
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Lesson | SmartCampus</title>

    <style>
        * { box-sizing: border-box; }

        body {
            font-family: "Segoe UI", Arial, sans-serif;
            background: #f1f5fb;
            color: #172554;
            margin: 0;
            padding: 30px 15px;
        }

        .container {
            max-width: 650px;
            margin: 30px auto;
            background: white;
            padding: 30px;
            border-radius: 16px;
            box-shadow: 0 5px 25px #17255410;
        }

        h1 { margin-top: 0; }

        label {
            display: block;
            font-weight: 600;
            margin: 18px 0 8px;
        }

        input, textarea, select {
            width: 100%;
            padding: 12px;
            border: 1px solid #cbd5e1;
            border-radius: 8px;
            font-size: 14px;
        }

        textarea {
            min-height: 110px;
            resize: vertical;
        }

        button {
            background: #2563eb;
            color: white;
            padding: 13px 20px;
            border: none;
            border-radius: 8px;
            font-weight: bold;
            cursor: pointer;
            margin-top: 22px;
        }

        .back {
            display: inline-block;
            margin-left: 12px;
            color: #2563eb;
            text-decoration: none;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>✏️ Edit Lesson</h1>
    <p>Update the lesson information below.</p>

    <form method="POST">

        <label>Select Course</label>

        <select name="course_id" required>
            {% for course in courses %}
                <option value="{{ course.id }}"
                    {% if course.id == lesson.course_id %}selected{% endif %}>
                    {{ course.name }}
                </option>
            {% endfor %}
        </select>

        <label>Lesson Title</label>
        <input type="text"
               name="title"
               value="{{ lesson.title }}"
               required>

        <label>Description</label>
        <textarea name="description">{{ lesson.description or '' }}</textarea>

        <label>YouTube Video URL</label>
        <input type="url"
               name="video_url"
               value="{{ lesson.video_url or '' }}">

        <label>Lesson Order</label>
        <input type="number"
               name="lesson_order"
               min="1"
               value="{{ lesson.lesson_order }}"
               required>

        <button type="submit">Save Changes</button>

        <a class="back" href="{{ url_for('admin_lessons') }}">
            Cancel
        </a>

    </form>

</div>

</body>
</html>
