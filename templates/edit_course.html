
<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Edit Course | SmartCampus</title>

    <style>
        * {
            box-sizing: border-box;
            margin: 0;
            padding: 0;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f1f5f9;
            color: #172554;
        }

        .container {
            width: 90%;
            max-width: 650px;
            margin: 60px auto;
            background: white;
            padding: 30px;
            border-radius: 15px;
            box-shadow: 0 5px 20px #00000010;
        }

        h1 {
            color: #2563eb;
            margin-bottom: 25px;
        }

        label {
            display: block;
            font-weight: bold;
            margin-bottom: 8px;
        }

        input, textarea {
            width: 100%;
            padding: 13px;
            margin-bottom: 20px;
            border: 1px solid #cbd5e1;
            border-radius: 7px;
            font-size: 15px;
            font-family: Arial, sans-serif;
        }

        textarea {
            height: 120px;
            resize: vertical;
        }

        .save-btn {
            width: 100%;
            padding: 14px;
            background: #2563eb;
            color: white;
            border: none;
            border-radius: 7px;
            font-size: 16px;
            font-weight: bold;
            cursor: pointer;
        }

        .save-btn:hover {
            background: #1d4ed8;
        }

        .back {
            display: block;
            text-align: center;
            margin-top: 20px;
            color: #2563eb;
            text-decoration: none;
            font-weight: bold;
        }
    </style>
</head>

<body>

<div class="container">

    <h1>✏️ Edit Course</h1>

    <form method="POST">

        <label>Course Name</label>

        <input
            type="text"
            name="name"
            value="{{ course.name }}"
            required
        >

        <label>Course Description</label>

        <textarea
            name="description"
            required
        >{{ course.description }}</textarea>

        <label>Course Duration</label>

        <input
            type="text"
            name="duration"
            value="{{ course.duration }}"
            required
        >

        <button type="submit" class="save-btn">
            Save Changes
        </button>

    </form>

    <a class="back" href="{{ url_for('admin_courses') }}">
        ← Back to Manage Courses
    </a>

</div>

</body>
</html>
